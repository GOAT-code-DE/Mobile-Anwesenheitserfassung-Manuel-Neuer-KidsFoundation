name: Teilbare Demo veröffentlichen
on:
  push:
    branches: [main]
    paths: ['preview/**', 'src/NeuerKids/Pages/**', 'src/NeuerKids/wwwroot/**', '.github/workflows/preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Öffentliche Demo aus den App-Oberflächen bauen
        run: python3 preview/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages
      - name: Demo veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
