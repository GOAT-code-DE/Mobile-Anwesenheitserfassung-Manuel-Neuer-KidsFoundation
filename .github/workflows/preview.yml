name: Teilbare Demo veröffentlichen
on:
  push:
    branches: [main]
    paths: ['preview/**', 'src/NeuerKids/Pages/**', 'src/NeuerKids/wwwroot/**', 'tests/browser/**', '.github/workflows/preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Öffentliche Demo aus den App-Oberflächen bauen
        run: python3 preview/build.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tests/browser/pnpm-lock.yaml
      - name: Browserprüfung vorbereiten
        run: |
          pnpm --dir tests/browser install --frozen-lockfile
          pnpm --dir tests/browser exec playwright install --with-deps chromium webkit
      - name: Mobile Oberfläche und Demo-Funktionen prüfen
        run: |
          python3 -m http.server 5081 --bind 127.0.0.1 --directory artifacts/pages &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          node tests/browser/preview.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages
      - name: Demo veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
